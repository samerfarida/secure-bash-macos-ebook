name: Build and Auto-Release eBook

on:
  workflow_run:
    workflows: ["Lint Markdown and YAML"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Only run if linting workflow completed successfully
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 🔍 Verify linting passed
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ Linting workflow did not pass. Skipping build."
            exit 1
          fi
          echo "✅ Linting workflow passed. Proceeding with build."

      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🧰 Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: 📦  Install Minimal TeX Live (optimized for speed)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            lmodern \
            fonts-linuxlibertine \
            fonts-dejavu-core \
            fonts-dejavu-extra

      - name: 🔢 Auto-version minor if new .md added, else patch
        id: compute_tag
        run: |
          # Highest semver tag (not git-describe nearest), so we never reuse
          # an older minor like v1.1.0 when v1.0.2 is the describe tip.
          LATEST_TAG=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST_TAG=${LATEST_TAG:-v1.0.0}
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          CHANGED=$(git diff --name-status "$LATEST_TAG"..HEAD | grep '\.md$' || true)
          ADDED=$(echo "$CHANGED" | grep '^A' || true)

          if [[ -n "$ADDED" ]]; then
            NEW_MINOR=$((MINOR + 1))
            NEW_PATCH=0
            BUMP_TYPE="minor"
          else
            NEW_MINOR=$MINOR
            NEW_PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi

          NEW_TAG="v$MAJOR.$NEW_MINOR.$NEW_PATCH"
          # Skip tags that already exist (e.g. out-of-order historical releases)
          while git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null 2>&1; do
            echo "⚠️  Tag $NEW_TAG already exists — bumping again"
            if [[ "$BUMP_TYPE" == "minor" ]]; then
              NEW_MINOR=$((NEW_MINOR + 1))
              NEW_PATCH=0
            else
              NEW_PATCH=$((NEW_PATCH + 1))
            fi
            NEW_TAG="v$MAJOR.$NEW_MINOR.$NEW_PATCH"
          done

          echo "📌 Bumping $BUMP_TYPE from $LATEST_TAG → $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: 🏷 Set version and date environment variables
        run: |
          echo "VERSION=${{ steps.compute_tag.outputs.tag }}" >> $GITHUB_ENV
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: 🛠 Inject version and date into metadata.yaml
        run: |
          sed -i.bak "s/__VERSION__/${{ env.VERSION }}/g" metadata.yaml
          sed -i.bak "s/__DATE__/${{ env.DATE }}/g" metadata.yaml

      - name: 📚 Build eBook formats
        run: |
          mkdir -p output

          FILEBASE="Secure-Bash-for-macOS-${{ env.VERSION }}"

          # Common chapter ordering
          CHAPTERS="$(find ebook/about.md) \
                     $(find ebook/part1_bash_fundamentals -name '*.md' | sort) \
                     $(find ebook/part2_advanced_security -name '*.md' | sort) \
                     $(find ebook/part3_real_world_projects -name '*.md' | sort) \
                     $(find ebook/appendices -name '*.md' | sort)"

          # Ensure all chapters are in the correct order
          echo "$CHAPTERS" | tr ' ' '\n'

          # PDF
          # Copy cover image to root for LaTeX to find it more easily
          cp ebook/assets/images/cover.png cover.png
          # Set titlepage-background and suppress text overlay (cover image contains all info)
          pandoc $CHAPTERS \
            --metadata-file=metadata.yaml \
            --highlight-style=templates/tango.theme \
            --template=templates/eisvogel.latex \
            -V geometry:margin=1in \
            -V titlepage=true \
            -V titlepage-background=cover.png \
            -V title="" \
            -V subtitle="" \
            -V author="" \
            -V date="" \
            -o output/${FILEBASE}.pdf
          rm -f cover.png

          # EPUB
          pandoc $CHAPTERS \
            --metadata-file=metadata.yaml \
            --css=templates/ebook-style.css \
            --toc --toc-depth=2 \
            --highlight-style=tango \
            -o output/${FILEBASE}.epub

          # HTML
          pandoc $CHAPTERS \
            --metadata-file=metadata.yaml \
            --css=templates/ebook-style.css \
            --toc --toc-depth=2 \
            --standalone \
            --highlight-style=tango \
            -o output/${FILEBASE}.html

          # Stable names for releases/latest/download (README badges)
          cp "output/${FILEBASE}.pdf" output/Secure-Bash-for-macOS.pdf
          cp "output/${FILEBASE}.epub" output/Secure-Bash-for-macOS.epub
          cp "output/${FILEBASE}.html" output/Secure-Bash-for-macOS.html

      - name: 🧹 Clean up backup file
        run: rm metadata.yaml.bak

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compute_tag.outputs.tag }}
          name: "Release ${{ steps.compute_tag.outputs.tag }} (${{ steps.compute_tag.outputs.bump_type }})"
          prerelease: false
          generate_release_notes: true
          files: |
            output/Secure-Bash-for-macOS-${{ env.VERSION }}.pdf
            output/Secure-Bash-for-macOS-${{ env.VERSION }}.epub
            output/Secure-Bash-for-macOS-${{ env.VERSION }}.html
            output/Secure-Bash-for-macOS.pdf
            output/Secure-Bash-for-macOS.epub
            output/Secure-Bash-for-macOS.html
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
